plugins { id 'com.android.application' }

android {
    namespace 'com.losprimos.pos'
    compileSdk 34
    defaultConfig {
        applicationId 'com.losprimos.pos'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.sunmi:printerlibrary:1.0.18'
}
