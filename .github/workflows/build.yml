name: Crear APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar carpetas del proyecto
        run: |
          mkdir -p app/src/main/java/com/losprimos/pos app/src/main/res/mipmap-xxxhdpi
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/losprimos/pos/ || true
          [ -f ic_launcher.png ] && mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ || true
          for f in *.gradle; do
            if grep -q "namespace" "$f"; then cp "$f" /tmp/app.gradle
            elif grep -q "apply false" "$f"; then cp "$f" /tmp/root.gradle; fi
          done
          cp /tmp/app.gradle app/build.gradle
          cp /tmp/root.gradle build.gradle
          rm -f "build (1).gradle"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LosPrimosPOS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
